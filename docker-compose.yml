services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: schoolrag
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d schoolrag"]
      interval: 5s
      retries: 10
    ports: ["5432:5432"]

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    volumes: [qdrant:/qdrant/storage]
    ports: ["6333:6333"]

  api:
    build: .
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    volumes: [storage:/data/storage, hf:/data/hf]
    ports: ["8000:8000"]
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-l", "info", "--concurrency=1", "-Q", "ingest"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    volumes: [storage:/data/storage, hf:/data/hf]
    restart: unless-stopped

volumes:
  pg:
  redis:
  qdrant:
  storage:
  hf:
